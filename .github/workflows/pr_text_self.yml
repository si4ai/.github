# This repo's own PR and issue text scan, called the way a caller repo does.
name: pr_text

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created, edited]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-text-${{ github.event_name }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr_text:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    uses: ./.github/workflows/pr_text.yml
