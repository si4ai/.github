# Shared hygiene report, called by si4ai public repos.
# Port of the hygiene_report job in repo-context-optimizer's ci.yml. The
# script tools/check_hygiene.py is a byte-identical copy; see README.md.
#
# Personal identifiers, secrets, home paths, addresses, emails, name tokens,
# typographic marks and junk files in the commit range, plus the PR title
# and body on a pull_request event. It reads the caller's optional
# ci/hygiene.toml and tools/hygiene_words.txt from the caller's tree.
#
# Report only by default: strict is false, so findings print and the job
# still passes, as in repo-context-optimizer today. strict: true exits 1 on
# any finding. A crash, a git failure or a bad config fails the job either
# way. Git only, standard library only: no install, no network, no secrets.
name: hygiene

on:
  workflow_call:
    inputs:
      strict:
        description: "Fail the job when there are findings (default: report only)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  hygiene_report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # This repo at the exact commit the caller pinned in its uses: line.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .si4ai-github
          persist-credentials: false
          sparse-checkout: tools
      - env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MQ_BASE: ${{ github.event.merge_group.base_sha }}
          MQ_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
          EVENT_PATH: ${{ github.event_path }}
          STRICT: ${{ inputs.strict }}
        run: |
          set -euo pipefail
          base=""
          head="$PUSH_SHA"
          case "$EVENT_NAME" in
            pull_request)
              head="$PR_HEAD"
              base=$(git merge-base "$PR_BASE" "$PR_HEAD" 2>/dev/null || echo "$PR_BASE")
              ;;
            merge_group)
              base="$MQ_BASE"
              head="$MQ_HEAD"
              ;;
            push)
              base="$PUSH_BEFORE"
              ;;
          esac
          if ! git cat-file -e "${base:-missing}^{commit}" 2>/dev/null; then
            base=$(git rev-parse --verify --quiet "$head^1" || true)
            echo "no usable base for this event; scanning the last commit against its first parent."
          fi
          if [ -z "$base" ]; then
            echo "root commit, nothing to compare: no hygiene report."
            exit 0
          fi
          event_args=()
          if [ -n "${EVENT_PATH:-}" ] && [ -f "$EVENT_PATH" ]; then
            event_args=(--event "$EVENT_PATH")
          fi
          strict_args=()
          if [ "$STRICT" = "true" ]; then
            strict_args=(--strict)
          fi
          python3 .si4ai-github/tools/check_hygiene.py --root . --base "$base" --head "$head" "${event_args[@]}" "${strict_args[@]}"
